<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Gaming Store Admin Login</title>

<link rel="stylesheet" href="css/login.css">

</head>

<body>

<div class="login-box">

<h1>🎮 Gaming Store</h1>

<p>Admin Login</p>

<input
type="email"
id="email"
placeholder="Admin Email">

<input
type="password"
id="password"
placeholder="Password">

<label class="remember">

<input
type="checkbox"
id="remember">

Remember Me

</label>

<button id="loginBtn">

Login

</button>

<p id="error"></p>

</div>

<script type="module" src="js/login.js"></script>

</body>

</html>
